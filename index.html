<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisdom.foods | FSANZ</title>
    <style>
        :root {
            --apple-blue: #0A84FF;
            --apple-blue-hover: #0070DF;
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #F5F5F7;
            --text-secondary: #86868B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Interactive Flowing Background */
        .bg-layer {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            /* High-Res New Zealand Milford Sound Landscape */
            background: url('https://images.unsplash.com/photo-1469521669194-babbdf900921?q=80&w=2500&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            z-index: -1;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .container {
            width: 90%;
            max-width: 720px;
            margin: 60px 20px;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Apple Pro Frosted Glass Effect */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .logo-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #E8E8ED;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 46px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 12px 0;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1A6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            font-size: 18px;
            background-color: rgba(0, 0, 0, 0.3);
            color: #FFFFFF;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input[type="text"]:focus {
            border-color: var(--apple-blue);
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.25);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        button {
            background-color: var(--apple-blue);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: var(--apple-blue-hover);
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.4);
        }

        button:active { transform: scale(0.98); }

        .verify-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .verify-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }

        #results {
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
        }

        #results.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        h3 {
            color: #FFFFFF;
            font-size: 21px;
            font-weight: 600;
            margin-top: 25px;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }

        ul {
            padding-left: 20px;
            color: #D2D2D7;
            line-height: 1.6;
            font-size: 16px;
        }

        li { margin-bottom: 10px; }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--apple-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        .food-img-container {
            overflow: hidden;
            border-radius: 14px;
            margin-top: 30px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .version {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 25px;
            text-align: right;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-layer" id="bgLayer"></div>

    <div class="container">
        <div class="glass-panel">
            <div class="logo-badge">Oceania Compliance Hub</div>
            <h1>Wisdom.foods</h1>
            <p class="subtitle">Exclusive FSANZ Standards & New Zealand Packaging Rules.</p>
            
            <input type="text" id="foodInput" placeholder="e.g., MANUKA HONEY, MILK, MUSTARD">
            
            <div class="btn-group">
                <button onclick="searchFood()">Retrieve FSANZ Rules</button>
                <button class="verify-btn" onclick="verifyResults()">Verify Source</button>
            </div>

            <div id="results">
                <div id="loading" style="text-align: center;">
                    <div class="spinner"></div>
                    <div style="color: #86868B; font-weight: 500; font-size: 15px; margin-top: 10px;">Querying FSANZ Code...</div>
                </div>
                <div id="content"></div>
                <div class="food-img-container" id="imgContainer">
                    <img id="foodImage" src="" alt="Food confirmation">
                </div>
                <div class="version" id="versionText"></div>
            </div>
        </div>
    </div>

    <script>
        // Interactive Mouse Flow for Background
        document.addEventListener('mousemove', (e) => {
            const bg = document.getElementById('bgLayer');
            const moveX = (e.clientX / window.innerWidth - 0.5) * 20; 
            const moveY = (e.clientY / window.innerHeight - 0.5) * 20;
            bg.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
        });

        async function searchFood() {
            const food = document.getElementById('foodInput').value.trim();
            if (!food) return;

            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('content');
            const imgContainer = document.getElementById('imgContainer');
            const img = document.getElementById('foodImage');
            
            resultsDiv.classList.add('visible');
            loadingDiv.style.display = 'block';
            contentDiv.innerHTML = '';
            imgContainer.style.display = 'none';
            document.getElementById('versionText').innerHTML = '';

            // Strictly FSANZ & Oceania Prompt
            const prompt = `Act as a legal expert in FSANZ (Food Standards Australia New Zealand). The user searched for: ${food}. 
            DO NOT include worldwide standards like FDA or EFSA. Provide exactly two things formatted in clean HTML (use <h3> and <ul> tags):
            1. Exact FSANZ Standards and codes governing ${food}.
            2. Oceania (NZ/AUS) packaging compliance and nutritional panel rules strictly for ${food}.
            Keep it highly factual, Oceania-focused, and concise. Do not add conversational filler.`;

           try {
                // Force a simpler request that only returns the final text, no raw JSON or reasoning logs
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=gpt-4o`);
                
                let textData = await response.text();
                
                // Clean up any stray markdown formatting the AI might try to add
                textData = textData.replace(/```html/gi, '').replace(/```/g, '').trim();
                
                loadingDiv.style.display = 'none';
                contentDiv.innerHTML = textData;
                
                img.src = `https://loremflickr.com/700/450/${encodeURIComponent(food)},food/all`;
                imgContainer.style.display = 'block';
                
                document.getElementById('versionText').innerText = `Data reflects active FSANZ Code (Australia/New Zealand).`;
            } catch (error) {
                loadingDiv.style.display = 'none';
                contentDiv.innerHTML = '<span style="color:#FF453A; font-weight:500;">Connection failed. Check network status.</span>';
            }

        function verifyResults() {
            alert("Wisdom.foods FSANZ Tool:\n\nInformation is dynamically sourced against Food Standards Australia New Zealand (FSANZ) regulations. For finalized commercial packaging in New Zealand or Australia, always cross-check with the official Food Standards Code register.");
        }
    </script>
</body>
</html>
